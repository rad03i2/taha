name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Add Android platform
        run: npx cap add android
      - name: Stamp build number
        run: echo "export const BUILD = ${{ github.run_number }};" > www/js/version.js
      - name: Patch project
        env:
          GL_BUILD: ${{ github.run_number }}
        run: ./scripts/patch-android.sh
      - name: Sync web assets
        run: npx cap sync android
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build debug APK (retry + Maven mirror fallback)
        working-directory: android
        run: |
          for i in 1 2 3; do
            if [ "$i" -gt 1 ]; then ARGS="-I ${{ github.workspace }}/scripts/gradle-mirror.init.gradle"; sleep $((i*20)); else ARGS=""; fi
            echo "== attempt $i ${ARGS:+(mirror)}"
            ./gradlew assembleDebug --no-daemon $ARGS && exit 0
          done
          exit 1
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/hesabat-almolada.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/hesabat-almolada.apk }
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="build-${{ github.run_number }}"
          NOTES="$(printf '%s' "$COMMIT_MSG" | head -n 12)"
          [ -n "$NOTES" ] || NOTES="Debug-signed build of commit ${{ github.sha }}"
          gh release create "$TAG" out/hesabat-almolada.apk --title "APK $TAG" --notes "$NOTES" --latest
