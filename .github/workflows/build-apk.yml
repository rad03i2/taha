name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Add Android platform
        run: npx cap add android
      - name: Patch project
        run: ./scripts/patch-android.sh
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/hesabat-almolada.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/hesabat-almolada.apk }
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/hesabat-almolada.apk --title "APK $TAG" --notes "Debug-signed build of commit ${{ github.sha }}" --latest
